name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # 태그 푸시 시 Release에 racer.exe 첨부

jobs:
  windows-exe:
    name: racer.exe (MinGW cross-compile) + 1.44MB check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64

      - name: Cache raylib
        uses: actions/cache@v4
        with:
          path: third_party
          key: raylib-5.5-${{ hashFiles('scripts/build.sh') }}

      - name: Lint (-Wall -Wextra -Werror)
        run: scripts/build.sh lint

      - name: Build and verify (size, GUI subsystem, system DLLs only)
        run: scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: racer-windows
          path: build/racer.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/racer.exe
