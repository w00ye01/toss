name: agentready

on:
  push:
    branches: [main]
    paths: ["agentready/**", ".github/workflows/agentready.yml"]
  pull_request:
    paths: ["agentready/**", ".github/workflows/agentready.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agentready

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agentready/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dogfood:
    name: Audit agentready with itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentready/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js . --min-score 90
      - name: Audit every project in this repository
        run: node dist/cli.js . ../onebutton-racing
